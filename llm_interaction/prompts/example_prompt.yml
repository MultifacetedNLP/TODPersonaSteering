intents_1 
	name: ReserveHotel
	required_slots: hotel_name, check_in_date, number_of_days, destination
	optional_slots: number_of_rooms: 1
	result_slots: destination, number_of_rooms, check_in_date, number_of_days, star_rating, hotel_name, street_address, phone_number, price_per_night, has_wifi

intents_2 
	name: SearchHotel
	required_slots: destination
	optional_slots: number_of_rooms: dontcare, has_wifi: dontcare, star_rating: dontcare
	result_slots: destination, number_of_rooms, star_rating, hotel_name, street_address, phone_number, price_per_night, has_wifi
end of schema.

Here are a few general guidelines to follow:
  - Don't overwhelm the USER with too many choices.
  - Confirm the slot values with the USER before finalizing the call.
  - Follow the structure of API call from the above example whenever you are making an API Call.
  - If you're unsure about something, it's always better to ask or confirm with the user.
  - If you feel the user is confused, guide the user with relevant suggestions and ensure it's relevant to their current intent.

