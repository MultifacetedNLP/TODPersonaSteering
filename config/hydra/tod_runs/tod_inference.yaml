defaults:
  - data_size: dstc_rest_movie_inference
  - dataset: dstc
  - _self_
hydra:
  run:
    dir: ./storage/local-${now:%Y%m%d-%H%M%S}/config
tokenizer_name: ${oc.env:PERSONA_TOD_TOKENIZER_NAME,meta-llama/Llama-3.1-8B-Instruct}
user:
  provider: openai
  model_name: gpt-4o
system:
  provider: local
  model_name: meta-llama/Llama-3.1-8B-Instruct
  anthropic:
    vector_path: ${oc.env:PERSONA_TOD_SYSTEM_ANTHROPIC_VECTOR_PATH,""}
    coef: 0.0
    layer: 20
activate_retry: true
add_example: true
num_dialogues_per_domain: 25
num_dialog_shards: 1
dialog_shard_id: 0
selection_seed: 13
num_workers: 8
test_prompt_max_len: 700
max_token_len: 1024
should_test: true
num_turns: 50
should_add_schema: true
should_add_user_actions: true
should_add_service_results: true
should_add_service_calls: true
should_add_results_slots: false
should_add_user_req_slots: true
project_root: "."
resume_checkpoint: ""
epochs: 1
overwrite:
  - 0
  - 0
  - 1
is_scale_grad: false
train_domain_settings: all
dev_domain_settings:
  - all
test_domain_settings:
  - [Restaurants_2]
  - [Movies_1, Movies_3]
multi_domain: true
prompt_type: default
out_dir: results
should_train: false
max_turns: 70
wandb:
  project: ZSTod
  entity: adibm
  notes: sgd
  task: nlg api call
